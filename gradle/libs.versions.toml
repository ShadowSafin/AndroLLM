[versions]
# Android & Kotlin
agp = "9.3.1"
kotlin = "2.2.10"
kotlinSerialization = "2.2.10"
ksp = "2.3.2"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
jvmTarget = "17"

# Compose
composeBom = "2024.10.00"
composeCompiler = "2.2.10"
material3 = "1.3.0"
materialIcons = "1.3.0"
animation = "1.6.0"
foundation = "1.6.0"
ui = "1.6.0"
tooling = "1.6.0"

# Navigation
navigation = "2.8.1"

# Hilt
hilt = "2.57.1"
hiltCompiler = "2.57.1"

# Room (2.8.x required for KSP2/Kotlin 2.3 compatibility)
room = "2.8.4"

# DataStore
datastore = "1.1.1"

# Coroutines & Flow
coroutines = "1.8.0"
flow = "1.8.0"

# Serialization
serialization = "1.6.3"

# Networking
ktor = "3.0.3"
ktorSerialization = "3.0.3"
ktorLogging = "3.0.3"
okhttp = "4.12.0"

# Image Loading
coil = "2.6.0"

# Logging
timber = "5.0.1"

# Permissions
accompanistPermissions = "0.32.0"

# Voice assistant (sherpa-onnx: wake word + streaming ASR + offline TTS)
sherpaOnnx = "1.13.4"

# Model Context Protocol (MCP) client — remote tool servers.
# 0.10.0 is the newest release built with Kotlin 2.2.x metadata (our toolchain
# is Kotlin 2.1.20, which can read up to 2.2); 0.13+ needs Kotlin 2.3+.
mcpKotlinSdk = "0.10.0"

# QR decoding (pure-Java, no Play Services)
zxing = "3.5.4"

# Document parsing + OCR (Knowledge Base RAG)
pdfbox = "2.0.27.0"
mlkitTextRecognition = "16.0.1"

# Testing
junit = "4.13.2"
junitJupiter = "5.10.2"
truth = "1.1.5"
espresso = "3.5.1"
uiTest = "1.6.0"
robolectric = "4.11"
mockk = "1.13.13"
turbine = "1.0.0"

# Code Quality
spotless = "6.25.0"
detekt = "1.23.6"
kdoc = "1.0.2"

# Publishing
mavenPublish = "0.31.0"

[plugins]
# Android & Kotlin
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerialization" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Hilt
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Code Quality
spotless = { id = "com.franciscokonzien.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.8.2" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.8.2" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.0" }
androidx-window = { group = "androidx.window", name = "window", version = "1.3.0" }

# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Compose Libraries
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-animation-core = { group = "androidx.compose.animation", name = "animation-core" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
compose-runtime-rxjava2 = { group = "androidx.compose.runtime", name = "runtime-rxjava2" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
navigation-runtime-ktx = { group = "androidx.navigation", name = "navigation-runtime-ktx", version.ref = "navigation" }
navigation-common-ktx = { group = "androidx.navigation", name = "navigation-common-ktx", version.ref = "navigation" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hiltCompiler" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }
androidx-hilt = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }
datastore-rxjava2 = { group = "androidx.datastore", name = "datastore-rxjava2", version.ref = "datastore" }

# Coroutines & Flow
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization
serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "serialization" }

# Networking
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktorLogging" }
ktor-serialization-kotlinx = { group = "io.ktor", name = "ktor-serialization-kotlinx", version.ref = "ktorSerialization" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Image Loading
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-core = { group = "io.coil-kt", name = "coil-core", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt", name = "coil-network-okhttp", version.ref = "coil" }

# Logging
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Permissions
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }

# Voice assistant (sherpa-onnx)
sherpa-onnx = { group = "com.github.k2-fsa", name = "sherpa-onnx", version.ref = "sherpaOnnx" }

# MCP
mcp-kotlin-sdk-client = { group = "io.modelcontextprotocol", name = "kotlin-sdk-client", version.ref = "mcpKotlinSdk" }

# Ktor bundled client plugins (SSE transport used by the MCP SDK)
ktor-client-plugins = { group = "io.ktor", name = "ktor-client-plugins", version.ref = "ktor" }

# QR
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Document parsing + OCR (Knowledge Base RAG)
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espresso" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version = "2.3.0" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.5.0" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.5.0" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }

[bundles]
compose = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling", "compose-ui-tooling-preview", "compose-material3", "compose-material-icons-extended", "compose-animation", "compose-animation-core", "compose-foundation", "compose-foundation-layout", "compose-runtime"]
compose-test = ["compose-ui-test", "compose-ui-test-junit4", "compose-ui-test-manifest"]
navigation = ["navigation-compose", "navigation-runtime-ktx", "navigation-common-ktx"]
room = ["room-runtime", "room-ktx", "room-compiler"]
datastore = ["datastore-preferences", "datastore-core"]
coroutines = ["coroutines-core", "coroutines-android"]
serialization = ["serialization-core"]
ktor = ["ktor-client-core", "ktor-client-android", "ktor-client-okhttp", "ktor-client-logging", "ktor-serialization-kotlinx", "ktor-client-content-negotiation"]
coil = ["coil-compose", "coil-core", "coil-network-okhttp"]
testing = ["junit", "junit-jupiter", "truth", "espresso-core", "espresso-intents", "uiautomator", "robolectric", "mockk", "turbine", "compose-ui-test", "compose-ui-test-junit4", "compose-ui-test-manifest", "androidx-test-core", "androidx-test-rules", "androidx-test-runner"]